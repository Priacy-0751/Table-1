<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marks Table</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 40px;
            color: #000000;
        }

        h2 {
            font-size: 20px;
            font-weight: normal;
            margin-bottom: 15px;
        }

        table {
            border-collapse: collapse;
            width: 300px;
        }

        th, td {
            border: 1px solid #000000; /* Distinct solid black border */
            padding: 8px 12px;
            text-align: left;
        }

        th {
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Student Marks</h2>

    <table>
        <thead>
            <tr>
                <th>Rank</th>
                <th>Name</th>
                <th>Marks</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Rohan</td>
                <td>94</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Zain</td>
                <td>91</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Meera</td>
                <td>88</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
